# This is a Databricks asset bundle definition for dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_dab
  uuid: 587e85e5-01a7-41b9-b5a8-54863a89f18d

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
    default: "citibike_dev"

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405607996355770.10.azuredatabricks.net
    variables:
      catalog: citibike_dev

  test:
    mode: production
    variables: 
      catalog: "citibike_test"
    presets:
      name_prefix: '[test] '
    workspace:
      host: https://adb-7405605681380645.5.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/adam@succira.onmicrosoft.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - service_principal_name: 46545b8c-cba7-49ae-ad1f-f1b45b702040
        level: CAN_MANAGE
    run_as:
      service_principal_name: 46545b8c-cba7-49ae-ad1f-f1b45b702040


      
  prod:
    mode: production
    variables: 
      catalog: "citibike_prod"
    workspace:
      host: https://adb-7405619566871631.11.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/adam@succira.onmicrosoft.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - service_principal_name: a654f8e9-813f-44e9-878e-2e87f624be52
        level: CAN_MANAGE
    run_as:
      service_principal_name: a654f8e9-813f-44e9-878e-2e87f624be52


