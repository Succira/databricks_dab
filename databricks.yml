# This is a Databricks asset bundle definition for dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_dab
  uuid: 587e85e5-01a7-41b9-b5a8-54863a89f18d

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use


targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405607996355770.10.azuredatabricks.net
    variables:
      catalog: dbw_cicd_dev
      schema: dev

  test:
    mode: production
    presets:
      name_prefix: '[test] '
    workspace:
      host: https://adb-7405605681380645.5.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/adam@succira.onmicrosoft.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbw_cicd_dev
      schema: prod
    permissions:
      - user_name: adam@succira.onmicrosoft.com
        level: CAN_MANAGE

      
  prod:
    mode: production
    workspace:
      host: https://adb-7405619566871631.11.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/adam@succira.onmicrosoft.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbw_cicd_dev
      schema: prod
    permissions:
      - user_name: adam@succira.onmicrosoft.com
        level: CAN_MANAGE
